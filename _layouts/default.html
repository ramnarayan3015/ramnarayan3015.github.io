<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {%- seo -%}
  <link rel="icon" type="image/png" href="/img/favicon.ico" />
  <!-- Portfolio's own stylesheets, loaded so blog pages match the site chrome -->
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/general.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/indexQuery.css" />
  <link rel="stylesheet" href="/css/drop_down.css" />
  <link rel="stylesheet" href="/css/enhancements.css" />
  <!-- Blog / projects / learning specifics — cache-busted by Jekyll build time -->
  <link rel="stylesheet" href="/css/blog.css?v={{ site.time | date: '%s' }}" />
  <link rel="stylesheet" href="/css/learning.css?v={{ site.time | date: '%s' }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Secular+One&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet" />
  {%- feed_meta -%}
</head>
<body>
  {% include site-nav.html %}
  <main class="page-main">
    <div class="page-container">
      {{ content }}
    </div>
  </main>
  {% include site-footer.html %}
  <button id="backToTop" class="back-to-top" aria-label="Back to top">
    <ion-icon name="arrow-up-outline"></ion-icon>
  </button>
  <script src="/js/index.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
